<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox Web Mini Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Roblox Web Mini Game</h1>
      <p>Phiên bản mô phỏng kiểu Roblox chạy trực tiếp trên trình duyệt.</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Điều khiển</h2>
        <ul>
          <li><kbd>W A S D</kbd>: di chuyển</li>
          <li><kbd>Space</kbd>: nhảy</li>
          <li><kbd>Shift</kbd>: chạy nhanh</li>
        </ul>
        <button id="resetBtn">Đặt lại vị trí</button>
      </section>

      <section class="game-wrap">
        <canvas id="game" width="960" height="540" aria-label="game canvas"></canvas>
        <div class="hud" id="hud"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
